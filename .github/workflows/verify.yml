name: Verify broadcast
on: [push, pull_request, workflow_dispatch]
jobs:
  teacher-and-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/teacher/package-lock.json
      - run: npm ci
        working-directory: apps/teacher
      - run: npm test && npm run build && npm run lint
        working-directory: apps/teacher
      - uses: denoland/setup-deno@v2.0.5
      - run: deno check supabase/functions/broadcast-api/index.ts && deno test supabase/tests/domain_test.ts
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project apps/classroom/Broadcast.Core.Tests
      - run: dotnet run --project apps/classroom/Broadcast.Visual.Tests -- artifacts/visual-qa
      - run: dotnet publish apps/classroom/Broadcast.Classroom/Broadcast.Classroom.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: classroom-windows-x64
          path: artifacts/windows-x64
